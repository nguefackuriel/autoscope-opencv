<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="AutoScope architecture: eyepiece capture uploads to S3, a Step Functions session runs an OpenCV 5 pipeline on Graviton with COOL, a Bedrock agent turns those measurements into the next capture action, and the loop repeats until the stopping rule fires.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1C1720"/>
    </marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5E2B8F"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#FFFFFF"/>
  <g font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" fill="#1C1720">

    <!-- capture row -->
    <rect x="24" y="28" width="210" height="54" rx="6" fill="none" stroke="#1C1720" stroke-width="1.2"/>
    <text x="129" y="50" font-size="12" font-weight="600" text-anchor="middle">Capture PWA</text>
    <text x="129" y="67" font-size="10" fill="#6B6472" text-anchor="middle">phone on eyepiece · or Virtual Stage</text>

    <line x1="234" y1="55" x2="318" y2="55" stroke="#1C1720" stroke-width="1.2" marker-end="url(#ar)"/>
    <text x="276" y="47" font-size="9.5" fill="#6B6472" text-anchor="middle">presigned</text>

    <rect x="318" y="28" width="150" height="54" rx="6" fill="none" stroke="#1C1720" stroke-width="1.2"/>
    <text x="393" y="50" font-size="12" font-weight="600" text-anchor="middle">S3</text>
    <text x="393" y="67" font-size="10" fill="#6B6472" text-anchor="middle">raw video / tiles</text>

    <path d="M 468 55 H 560 V 120" fill="none" stroke="#1C1720" stroke-width="1.2" marker-end="url(#ar)"/>
    <text x="566" y="90" font-size="9.5" fill="#6B6472">EventBridge</text>

    <!-- session container -->
    <rect x="24" y="120" width="680" height="450" rx="10" fill="none" stroke="#6B6472" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="42" y="145" font-size="11" font-weight="600" fill="#6B6472" letter-spacing="0.06em">STEP FUNCTIONS / SCAN SESSION</text>

    <!-- perceive -->
    <rect x="48" y="166" width="250" height="260" rx="8" fill="none" stroke="#5E2B8F" stroke-width="2"/>
    <text x="64" y="190" font-size="12" font-weight="700" fill="#5E2B8F" letter-spacing="0.08em">PERCEIVE</text>
    <text x="64" y="207" font-size="10" fill="#6B6472">AWS Batch · Graviton4 c8g · Spot</text>
    <line x1="64" y1="218" x2="282" y2="218" stroke="#E2DEE7" stroke-width="1"/>

    <rect x="64" y="230" width="218" height="180" rx="6" fill="#5E2B8F" fill-opacity="0.06" stroke="#5E2B8F" stroke-width="0.8"/>
    <text x="76" y="250" font-size="11" font-weight="700" fill="#5E2B8F">COOL + OpenCV 5</text>
    <g font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="9" fill="#1C1720">
      <text x="76" y="272">1  Laplacian focus · calcHist</text>
      <text x="76" y="290">2  flat-field · Lab stain norm</text>
      <text x="76" y="308">3  ORB + findHomography</text>
      <text x="76" y="326">4  watershed · findContours</text>
      <text x="76" y="344">5  cv::dnn ONNX, FP16</text>
      <text x="76" y="362">6  parasites/µL + CI</text>
    </g>
    <text x="76" y="390" font-size="9.5" font-weight="600" fill="#5E2B8F">core workload, runs on Arm</text>

    <!-- perceive -> decide -->
    <line x1="298" y1="242" x2="420" y2="242" stroke="#1C1720" stroke-width="1.2" marker-end="url(#ar)"/>
    <text x="359" y="234" font-size="9.5" fill="#6B6472" text-anchor="middle">focus · debris · CI</text>

    <!-- decide -->
    <rect x="420" y="166" width="260" height="152" rx="8" fill="none" stroke="#1C1720" stroke-width="1.6"/>
    <text x="436" y="190" font-size="12" font-weight="700" letter-spacing="0.08em">DECIDE</text>
    <text x="436" y="207" font-size="10" fill="#6B6472">Amazon Bedrock · Claude, tool use</text>
    <line x1="436" y1="218" x2="664" y2="218" stroke="#E2DEE7" stroke-width="1"/>
    <g font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="9" fill="#1C1720">
      <text x="436" y="240">assess_field   refocus</text>
      <text x="436" y="258">move_stage     count_field</text>
      <text x="436" y="276">estimate_parasitaemia</text>
      <text x="436" y="294">decide_stop    flag_for_human</text>
    </g>

    <!-- decide -> act -->
    <line x1="550" y1="318" x2="550" y2="376" stroke="#5E2B8F" stroke-width="1.6" marker-end="url(#arA)"/>
    <text x="560" y="352" font-size="9.5" fill="#5E2B8F">action</text>

    <!-- act -->
    <rect x="420" y="376" width="260" height="64" rx="8" fill="none" stroke="#5E2B8F" stroke-width="1.6"/>
    <text x="436" y="400" font-size="12" font-weight="700" fill="#5E2B8F" letter-spacing="0.08em">ACT</text>
    <text x="436" y="420" font-size="10" fill="#1C1720">refocus z · move stage · stop · escalate</text>

    <!-- loop back -->
    <path d="M 420 408 H 366 V 500 H 173 V 432" fill="none" stroke="#5E2B8F" stroke-width="1.6" marker-end="url(#arA)"/>
    <text x="270" y="493" font-size="9.5" fill="#5E2B8F" text-anchor="middle">next tile / next z-plane</text>

    <text x="42" y="548" font-size="9.5" fill="#6B6472">Caps on fields, wall-clock and spend are set here, not by the model.</text>

    <!-- right column -->
    <line x1="704" y1="200" x2="730" y2="200" stroke="#1C1720" stroke-width="1.2" marker-end="url(#ar)"/>
    <rect x="730" y="166" width="206" height="68" rx="6" fill="none" stroke="#1C1720" stroke-width="1.2"/>
    <text x="746" y="188" font-size="11" font-weight="600">DynamoDB</text>
    <text x="746" y="205" font-size="9.5" fill="#6B6472">session state +</text>
    <text x="746" y="219" font-size="9.5" fill="#6B6472">full decision trace</text>

    <line x1="704" y1="310" x2="730" y2="310" stroke="#1C1720" stroke-width="1.2" marker-end="url(#ar)"/>
    <rect x="730" y="266" width="206" height="88" rx="6" fill="none" stroke="#1C1720" stroke-width="1.2"/>
    <text x="746" y="288" font-size="11" font-weight="600">API Gateway · CloudFront</text>
    <text x="746" y="305" font-size="9.5" fill="#6B6472">judge endpoint: live mosaic,</text>
    <text x="746" y="319" font-size="9.5" fill="#6B6472">streaming trace,</text>
    <text x="746" y="333" font-size="9.5" fill="#6B6472">parasites/µL ± CI</text>

    <line x1="704" y1="420" x2="730" y2="420" stroke="#1C1720" stroke-width="1.2" marker-end="url(#ar)"/>
    <rect x="730" y="386" width="206" height="68" rx="6" fill="none" stroke="#1C1720" stroke-width="1.2"/>
    <text x="746" y="408" font-size="11" font-weight="600">S3 artefacts</text>
    <text x="746" y="425" font-size="9.5" fill="#6B6472">mosaics, annotated fields,</text>
    <text x="746" y="439" font-size="9.5" fill="#6B6472">PDF report</text>

    <rect x="730" y="486" width="206" height="68" rx="6" fill="none" stroke="#6B6472" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="746" y="508" font-size="11" font-weight="600" fill="#6B6472">CloudWatch · Budgets</text>
    <text x="746" y="525" font-size="9.5" fill="#6B6472">latency, $/slide,</text>
    <text x="746" y="539" font-size="9.5" fill="#6B6472">alarm + auto teardown</text>
  </g>
</svg>
