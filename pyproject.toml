[project]
name = "autoscope"
version = "0.1.0"
description = "Agent-driven malaria slide reading with OpenCV 5 on AWS Graviton"
requires-python = ">=3.11"
dependencies = [
    "opencv-python==5.0.0.93",
    "numpy==2.3.4",
    "scipy==1.16.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
